name: Publish portfolio

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Discover artwork images and videos
        run: python script/art-media.py
      - uses: actions/configure-pages@v5
      - name: Collect website files
        run: |
          mkdir _site
          cp *.html _site/
          cp -R art image image2 img portfolio script style _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          find _site -name .DS_Store -delete
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
